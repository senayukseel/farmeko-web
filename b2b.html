<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bayi Başvurusu | FARMEKO</title>
  <meta name="description" content="Farmeko bayilik ve B2B iş ortaklığı başvuru formu.">

  <!-- Favicon & app icons (FARMEKO standard block - same on every page) -->
  <link rel="icon" type="image/png" href="images/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
  <link rel="shortcut icon" href="images/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="FARMEKO" />
  <link rel="manifest" href="images/site.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />

    <!-- Fonts: preload so text does not jump when the font arrives -->
  <link rel="preload" href="fonts/PlusJakartaSans-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/PlayfairDisplay-Variable.woff2" as="font" type="font/woff2" crossorigin>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">

  <!-- Apply saved theme BEFORE render to avoid a white flash -->
  <script>
    try { document.documentElement.setAttribute("data-bs-theme", localStorage.getItem("farmeko_theme") || "light"); } catch (e) {}
  </script>

  <style>
    /* Section titles: extra bottom space on this page */
    .fk-section-title { margin-bottom: 1.2rem; }

    /* Benefits */
    .fk-benefit { display: flex; gap: .9rem; align-items: flex-start; margin-bottom: 1.3rem; }
    .fk-benefit-icon {
      flex: 0 0 48px; width: 48px; height: 48px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(116,204,0,.15); color: var(--fk-accent); font-size: 1.4rem;
    }

    /* B2B form sections */
    .fk-form-card fieldset { border: 0; padding: 0; margin: 0; }
    .fk-form-card legend.fk-legend {
      font-size: .85rem; font-weight: 800; text-transform: uppercase; letter-spacing: .5px;
      color: var(--fk-accent); margin-bottom: .8rem; padding: 0; float: none; width: auto;
    }
  </style>
</head>
<body>

  <div id="site-header"></div>

  <main>

    <!-- ================= PAGE HEADER ================= -->
    <section class="fk-page-header">
      <div class="container">
        <h1 data-i18n="b2b.title"></h1>
        <ul class="fk-breadcrumb">
          <li><a href="index.html" data-i18n="nav.home"></a></li>
          <li data-i18n="nav.b2b"></li>
        </ul>
      </div>
    </section>

    <!-- ================= BENEFITS + FORM ================= -->
    <section class="py-5">
      <div class="container">
        <div class="row g-5">

          <!-- Benefits -->
          <div class="col-lg-5">
            <h2 class="fk-section-title h3" data-i18n="b2b.why.title"></h2>
            <p class="text-body-secondary mb-4" data-i18n="b2b.why.text"></p>

            <div class="fk-benefit">
              <div class="fk-benefit-icon"><i class="bi bi-tags-fill"></i></div>
              <div><strong data-i18n="b2b.b1.title"></strong><br><span class="small text-body-secondary" data-i18n="b2b.b1.text"></span></div>
            </div>
            <div class="fk-benefit">
              <div class="fk-benefit-icon"><i class="bi bi-box-seam-fill"></i></div>
              <div><strong data-i18n="b2b.b2.title"></strong><br><span class="small text-body-secondary" data-i18n="b2b.b2.text"></span></div>
            </div>
            <div class="fk-benefit">
              <div class="fk-benefit-icon"><i class="bi bi-headset"></i></div>
              <div><strong data-i18n="b2b.b3.title"></strong><br><span class="small text-body-secondary" data-i18n="b2b.b3.text"></span></div>
            </div>
            <div class="fk-benefit">
              <div class="fk-benefit-icon"><i class="bi bi-globe-europe-africa"></i></div>
              <div><strong data-i18n="b2b.b4.title"></strong><br><span class="small text-body-secondary" data-i18n="b2b.b4.text"></span></div>
            </div>
          </div>

          <!-- Form -->
          <div class="col-lg-7">
            <div class="fk-form-card">
              <h2 class="h4 fw-bold mb-1" data-i18n="b2b.form.title"></h2>
              <p class="text-body-secondary small mb-4" data-i18n="b2b.form.note"></p>

              <form id="b2bForm" novalidate>

                <!-- Honeypot (bots fill this, people never see it) -->
                <div class="fk-hp" aria-hidden="true">
                  <label for="website">Website</label>
                  <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
                </div>

                <fieldset class="mb-4">
                  <legend class="fk-legend" data-i18n="b2b.sec.company"></legend>
                  <div class="row g-3">
                    <div class="col-md-6">
                      <label for="company" class="form-label"><span data-i18n="b2b.f.company"></span> *</label>
                      <input type="text" class="form-control" id="company" name="company" required minlength="2" autocomplete="organization">
                      <div class="invalid-feedback" data-i18n="b2b.err.required"></div>
                    </div>
                    <div class="col-md-6">
                      <label for="businessType" class="form-label"><span data-i18n="b2b.f.type"></span> *</label>
                      <select class="form-select" id="businessType" name="businessType" required>
                        <option value="" data-i18n="b2b.select"></option>
                        <option value="dealer" data-i18n="b2b.type.dealer"></option>
                        <option value="vet" data-i18n="b2b.type.vet"></option>
                        <option value="farm" data-i18n="b2b.type.farm"></option>
                        <option value="distributor" data-i18n="b2b.type.distributor"></option>
                        <option value="other" data-i18n="b2b.type.other"></option>
                      </select>
                      <div class="invalid-feedback" data-i18n="b2b.err.select"></div>
                    </div>
                    <div class="col-md-6">
                      <label for="taxOffice" class="form-label" data-i18n="b2b.f.taxOffice"></label>
                      <input type="text" class="form-control" id="taxOffice" name="taxOffice">
                    </div>
                    <div class="col-md-6">
                      <label for="taxNo" class="form-label" data-i18n="b2b.f.taxNo"></label>
                      <input type="text" class="form-control" id="taxNo" name="taxNo" maxlength="30">
                    </div>
                  </div>
                </fieldset>

                <fieldset class="mb-4">
                  <legend class="fk-legend" data-i18n="b2b.sec.contact"></legend>
                  <div class="row g-3">
                    <div class="col-12">
                      <label for="contactName" class="form-label"><span data-i18n="b2b.f.name"></span> *</label>
                      <input type="text" class="form-control" id="contactName" name="contactName" required minlength="2" autocomplete="name">
                      <div class="invalid-feedback" data-i18n="b2b.err.required"></div>
                    </div>
                    <div class="col-12">
                      <label for="phone" class="form-label"><span data-i18n="b2b.f.phone"></span> *</label>
                      <div class="input-group has-validation">
                        <select class="form-select" id="phoneCode" name="phoneCode"
                                style="max-width: 13rem;" data-i18n-aria="b2b.f.phoneCode"></select>
                        <input type="tel" class="form-control" id="phone" name="phone" required
                               placeholder="532 123 45 67" autocomplete="tel-national">
                        <div class="invalid-feedback" data-i18n="b2b.err.phone"></div>
                      </div>
                    </div>
                    <div class="col-12">
                      <label for="email" class="form-label"><span data-i18n="b2b.f.email"></span> *</label>
                      <input type="email" class="form-control" id="email" name="email" required autocomplete="email">
                      <div class="invalid-feedback" data-i18n="b2b.err.email"></div>
                    </div>
                    <div class="col-md-6">
                      <label for="country" class="form-label"><span data-i18n="b2b.f.country"></span> *</label>
                      <input type="text" class="form-control" id="country" name="country" required autocomplete="country-name">
                      <div class="invalid-feedback" data-i18n="b2b.err.required"></div>
                    </div>
                    <div class="col-md-6">
                      <label for="city" class="form-label"><span data-i18n="b2b.f.city"></span> *</label>
                      <input type="text" class="form-control" id="city" name="city" required autocomplete="address-level2">
                      <div class="invalid-feedback" data-i18n="b2b.err.required"></div>
                    </div>
                  </div>
                </fieldset>

                <fieldset class="mb-4">
                  <legend class="fk-legend" data-i18n="b2b.sec.interest"></legend>
                  <div class="row g-2">
                    <div class="col-sm-6">
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="int-nutrition" name="interest" value="nutrition">
                        <label class="form-check-label" for="int-nutrition" data-i18n="cat.nutrition"></label>
                      </div>
                    </div>
                    <div class="col-sm-6">
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="int-equipment" name="interest" value="equipment">
                        <label class="form-check-label" for="int-equipment" data-i18n="cat.equipment"></label>
                      </div>
                    </div>
                    <div class="col-sm-6">
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="int-machinery" name="interest" value="machinery">
                        <label class="form-check-label" for="int-machinery" data-i18n="cat.machinery"></label>
                      </div>
                    </div>
                    <div class="col-sm-6">
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="int-veterinary" name="interest" value="veterinary">
                        <label class="form-check-label" for="int-veterinary" data-i18n="cat.veterinary"></label>
                      </div>
                    </div>
                  </div>
                  <div class="mt-3">
                    <label for="message" class="form-label" data-i18n="b2b.f.message"></label>
                    <textarea class="form-control" id="message" name="message" rows="4" maxlength="1500"></textarea>
                  </div>
                </fieldset>

                <div class="form-check mb-4">
                  <input class="form-check-input" type="checkbox" id="consent" name="consent" required>
                  <label class="form-check-label small" for="consent" data-i18n="b2b.consent"></label>
                  <div class="invalid-feedback" data-i18n="b2b.err.consent"></div>
                </div>

                <button type="submit" class="btn btn-farmeko btn-lg w-100">
                  <i class="bi bi-send-fill me-2"></i><span data-i18n="b2b.submit"></span>
                </button>
              </form>
            </div>
          </div>

        </div>
      </div>
    </section>

  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/components.js"></script>
  <script src="js/b2b.js"></script>
</body>
</html>
