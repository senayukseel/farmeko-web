<!DOCTYPE html>
<html lang="tr">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FARMEKO</title>

  <meta name="description" content="Farmeko: yem katkıları, hayvancılık ekipmanları, tarım makineleri ve veteriner ürünleri.">

  <!-- Favicon & app icons (FARMEKO standard block - same on every page) -->
  <link rel="icon" type="image/png" href="images/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
  <link rel="shortcut icon" href="images/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="FARMEKO" />
  <link rel="manifest" href="images/site.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />

    <!-- Fonts: preload so text does not jump when the font arrives -->
  <link rel="preload" href="fonts/PlusJakartaSans-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/PlayfairDisplay-Variable.woff2" as="font" type="font/woff2" crossorigin>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  
  <!-- Apply saved theme BEFORE render to avoid a white flash -->
  <script>
    try { document.documentElement.setAttribute("data-bs-theme", localStorage.getItem("farmeko_theme") || "light"); } catch (e) {}
  </script>

  <!-- Home page-only styles (we may move these into style.css later) -->
  <style>
    /* Hero */
    .fk-hero-slide {
      min-height: 540px;
      display: flex;
      align-items: center;
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .fk-hero-slide::before {          /* dark overlay for text contrast */
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(0,0,0,.55), rgba(0,0,0,.15));
    }
    .fk-hero-slide .container { position: relative; z-index: 2; }
    .fk-hero-1 { background: linear-gradient(135deg, #1a3304 0%, #4a850a 100%); }
    .fk-hero-2 { background: linear-gradient(135deg, #000000 0%, #2d5206 100%); }
    .fk-hero-3 { background: linear-gradient(135deg, #2d5206 0%, #74cc00 140%); }
    .fk-hero-icon {
      position: absolute;
      right: 6%;
      bottom: -30px;
      font-size: 22rem;
      line-height: 1;
      color: rgba(255,255,255,.08);
      z-index: 1;
      pointer-events: none;
    }
    .fk-hero-slide h1 { font-weight: 800; letter-spacing: -0.5px; max-width: 720px; }
    .fk-hero-slide p  { max-width: 560px; font-size: 1.15rem; color: #e8e8e8; }
    .fk-hero-badge {
      display: inline-block;
      background: var(--fk-green-light);
      color: #000;
      font-weight: 700;
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: .6px;
      padding: .3rem .8rem;
      border-radius: 2rem;
    }
    .carousel-indicators [data-bs-target] { width: 28px; height: 4px; border: 0; }

    /* Category cards */
    .fk-cat-card {
      display: block; height: 100%;
      text-decoration: none; color: inherit;
      border: 1px solid var(--bs-border-color);
      border-radius: var(--fk-radius);
      padding: 1.8rem 1.4rem;
      background: var(--bs-body-bg);
      transition: all .25s ease;
    }
    .fk-cat-card:hover {
      transform: translateY(-6px);
      border-color: var(--fk-green-light);
      box-shadow: 0 10px 28px rgba(74,133,10,.18);
      color: inherit;
    }
    .fk-cat-icon {
      width: 64px; height: 64px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 14px;
      background: rgba(116,204,0,.15);
      color: var(--fk-accent);
      font-size: 1.9rem;
      margin-bottom: 1rem;
      transition: all .25s ease;
    }
    .fk-cat-card:hover .fk-cat-icon { background: var(--fk-green-dark); color: #fff; }
    .fk-cat-card h3 { font-size: 1.1rem; font-weight: 700; }
    .fk-cat-more { color: var(--fk-accent); font-weight: 600; font-size: .9rem; }

    /* Trust badges */
    .fk-trust { background: var(--bs-tertiary-bg); }
    .fk-trust-item i { font-size: 2.4rem; color: var(--fk-accent); }

    /* CTA band */
    .fk-cta {
      background: linear-gradient(135deg, #000 0%, #2d5206 100%);
      color: #fff;
    }
  </style>
</head>
<body>

  <div id="site-header"></div>

  <main>

    <!-- ================= HERO SLIDER ================= -->
    <section id="hero" class="carousel slide carousel-fade" data-bs-ride="carousel" data-bs-interval="6000">
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#hero" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#hero" data-bs-slide-to="1" aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#hero" data-bs-slide-to="2" aria-label="Slide 3"></button>
      </div>

      <div class="carousel-inner">
        <div class="carousel-item active">
          <div class="fk-hero-slide fk-hero-1">
            <i class="bi bi-capsule-pill fk-hero-icon"></i>
            <div class="container py-5">
              <span class="fk-hero-badge mb-3" data-i18n="home.hero1.badge"></span>
              <h1 class="display-4 mt-3" data-i18n="home.hero1.title"></h1>
              <p class="mt-3" data-i18n="home.hero1.text"></p>
              <div class="mt-4 d-flex flex-wrap gap-2">
                <a href="products.html?category=nutrition" class="btn btn-farmeko btn-lg" data-i18n="home.hero.cta.products"></a>
                <a href="contact.html" class="btn btn-outline-light btn-lg" data-i18n="home.hero.cta.contact"></a>
              </div>
            </div>
          </div>
        </div>

        <div class="carousel-item">
          <div class="fk-hero-slide fk-hero-2">
            <i class="bi bi-gear-wide-connected fk-hero-icon"></i>
            <div class="container py-5">
              <span class="fk-hero-badge mb-3" data-i18n="home.hero2.badge"></span>
              <h1 class="display-4 mt-3" data-i18n="home.hero2.title"></h1>
              <p class="mt-3" data-i18n="home.hero2.text"></p>
              <div class="mt-4 d-flex flex-wrap gap-2">
                <a href="products.html?category=equipment" class="btn btn-farmeko btn-lg" data-i18n="home.hero.cta.products"></a>
                <a href="contact.html" class="btn btn-outline-light btn-lg" data-i18n="home.hero.cta.contact"></a>
              </div>
            </div>
          </div>
        </div>

        <div class="carousel-item">
          <div class="fk-hero-slide fk-hero-3">
            <i class="bi bi-shop fk-hero-icon"></i>
            <div class="container py-5">
              <span class="fk-hero-badge mb-3" data-i18n="home.hero3.badge"></span>
              <h1 class="display-4 mt-3" data-i18n="home.hero3.title"></h1>
              <p class="mt-3" data-i18n="home.hero3.text"></p>
              <div class="mt-4 d-flex flex-wrap gap-2">
                <a href="b2b.html" class="btn btn-farmeko btn-lg" data-i18n="home.hero3.cta"></a>
                <a href="corporate.html" class="btn btn-outline-light btn-lg" data-i18n="home.hero3.cta2"></a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <button class="carousel-control-prev" type="button" data-bs-target="#hero" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#hero" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </section>

    <!-- ================= 4 CATEGORY QUICK LINKS ================= -->
    <section class="py-5">
      <div class="container">
        <div class="text-center mb-5">
          <h2 class="fk-section-title" data-i18n="home.categories.title"></h2>
          <p class="text-body-secondary mt-3" data-i18n="home.categories.subtitle"></p>
        </div>

        <div class="row g-4">
          <div class="col-6 col-lg-3">
            <a class="fk-cat-card" href="products.html?category=nutrition">
              <div class="fk-cat-icon"><i class="bi bi-capsule"></i></div>
              <h3 data-i18n="cat.nutrition"></h3>
              <p class="small text-body-secondary" data-i18n="home.cat.nutrition.desc"></p>
              <span class="fk-cat-more"><span data-i18n="home.viewAll"></span> <i class="bi bi-arrow-right"></i></span>
            </a>
          </div>
          <div class="col-6 col-lg-3">
            <a class="fk-cat-card" href="products.html?category=equipment">
              <div class="fk-cat-icon"><i class="bi bi-droplet-half"></i></div>
              <h3 data-i18n="cat.equipment"></h3>
              <p class="small text-body-secondary" data-i18n="home.cat.equipment.desc"></p>
              <span class="fk-cat-more"><span data-i18n="home.viewAll"></span> <i class="bi bi-arrow-right"></i></span>
            </a>
          </div>
          <div class="col-6 col-lg-3">
            <a class="fk-cat-card" href="products.html?category=machinery">
              <div class="fk-cat-icon"><i class="bi bi-truck"></i></div>
              <h3 data-i18n="cat.machinery"></h3>
              <p class="small text-body-secondary" data-i18n="home.cat.machinery.desc"></p>
              <span class="fk-cat-more"><span data-i18n="home.viewAll"></span> <i class="bi bi-arrow-right"></i></span>
            </a>
          </div>
          <div class="col-6 col-lg-3">
            <a class="fk-cat-card" href="products.html?category=veterinary">
              <div class="fk-cat-icon"><i class="bi bi-heart-pulse"></i></div>
              <h3 data-i18n="cat.veterinary"></h3>
              <p class="small text-body-secondary" data-i18n="home.cat.veterinary.desc"></p>
              <span class="fk-cat-more"><span data-i18n="home.viewAll"></span> <i class="bi bi-arrow-right"></i></span>
            </a>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= FEATURED PRODUCTS ================= -->
    <section class="py-5 bg-body-tertiary">
      <div class="container">
        <div class="d-flex flex-wrap justify-content-between align-items-end mb-4 gap-2">
          <h2 class="fk-section-title" data-i18n="home.featured.title"></h2>
          <a href="products.html" class="btn btn-outline-farmeko" data-i18n="home.featured.all"></a>
        </div>

        <!-- Filled by js/home.js from data.js -->
        <div id="featuredProducts" class="row g-4"></div>
      </div>
    </section>

    <!-- ================= TRUST BADGES ================= -->
    <section class="py-5">
      <div class="container">
        <div class="text-center mb-5">
          <h2 class="fk-section-title" data-i18n="home.trust.title"></h2>
        </div>
        <div class="row g-4 text-center">
          <div class="col-6 col-lg-3 fk-trust-item">
            <i class="bi bi-patch-check-fill"></i>
            <h3 class="h6 fw-bold mt-3" data-i18n="home.trust1.title"></h3>
            <p class="small text-body-secondary mb-0" data-i18n="home.trust1.text"></p>
          </div>
          <div class="col-6 col-lg-3 fk-trust-item">
            <i class="bi bi-globe-europe-africa"></i>
            <h3 class="h6 fw-bold mt-3" data-i18n="home.trust2.title"></h3>
            <p class="small text-body-secondary mb-0" data-i18n="home.trust2.text"></p>
          </div>
          <div class="col-6 col-lg-3 fk-trust-item">
            <i class="bi bi-headset"></i>
            <h3 class="h6 fw-bold mt-3" data-i18n="home.trust3.title"></h3>
            <p class="small text-body-secondary mb-0" data-i18n="home.trust3.text"></p>
          </div>
          <div class="col-6 col-lg-3 fk-trust-item">
            <i class="bi bi-diagram-3-fill"></i>
            <h3 class="h6 fw-bold mt-3" data-i18n="home.trust4.title"></h3>
            <p class="small text-body-secondary mb-0" data-i18n="home.trust4.text"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= CTA BAND ================= -->
    <section class="fk-cta py-5">
      <div class="container d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
        <div>
          <h2 class="h3 fw-bold mb-1" data-i18n="home.cta.title"></h2>
          <p class="mb-0 text-white-50" data-i18n="home.cta.text"></p>
        </div>
        <a href="b2b.html" class="btn btn-farmeko btn-lg" data-i18n="home.cta.button"></a>
      </div>
    </section>

  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/components.js"></script>
  <script src="js/data.js"></script>   <!-- created in Step 3; a 404 in the console until then is normal -->
  <script src="js/home.js"></script>
</body>
</html>
