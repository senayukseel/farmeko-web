<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ürün Detayı | FARMEKO</title>
  <meta name="description" content="Farmeko ürün detayı.">

  <!-- Favicon & app icons (FARMEKO standard block - same on every page) -->
  <link rel="icon" type="image/png" href="images/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
  <link rel="shortcut icon" href="images/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="FARMEKO" />
  <link rel="manifest" href="images/site.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />

    <!-- Fonts: preload so text does not jump when the font arrives -->
  <link rel="preload" href="fonts/PlusJakartaSans-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/PlayfairDisplay-Variable.woff2" as="font" type="font/woff2" crossorigin>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">

  <script>
    // Tarayıcı sayfayı çizmeden hemen önce temayı kontrol et ve uygula
    (function () {
      const savedTheme = localStorage.getItem("theme") || "light";
      document.documentElement.setAttribute("data-bs-theme", savedTheme);
    })();
  </script>


  <!-- Apply saved theme BEFORE render to avoid a white flash -->
  <script>
    try { document.documentElement.setAttribute("data-bs-theme", localStorage.getItem("farmeko_theme") || "light"); } catch (e) {}
  </script>

  <!-- Detail page styles (duplicated card rules will be merged into style.css at the end) -->
  <style>

    /* Thinner header band on this page */
    .fk-page-header { padding: 1.6rem 0; }

    /* Main image */
    .fk-detail-img {
      position: relative;
      aspect-ratio: 4 / 3;
      border: 1px solid var(--bs-border-color);
      border-radius: var(--fk-radius);
      background: var(--bs-tertiary-bg);
      display: flex; align-items: center; justify-content: center;
      color: var(--bs-secondary-color);
      font-size: 5rem;
      overflow: hidden;
    }
    .fk-detail-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; }

    /* Info column */
    .fk-detail-cat { font-size: .8rem; text-transform: uppercase; letter-spacing: .6px; color: var(--fk-accent); font-weight: 700; }
    .fk-detail-title { font-weight: 800; letter-spacing: -.3px; }
    .fk-detail-note { font-size: .85rem; }
    .fk-detail-note i { color: var(--fk-accent); }

    /* Section titles: extra bottom space on this page */
    .fk-section-title { margin-bottom: 1.2rem; }

    /* Description + specs */
    .fk-detail-desc p { line-height: 1.75; }
    .fk-detail-desc ul { padding-left: 1.2rem; }
    .fk-spec-table th { width: 38%; font-weight: 700; background: var(--bs-tertiary-bg); }
    .fk-spec-table th, .fk-spec-table td { padding: .75rem 1rem; }

  </style>
</head>
<body>

  <div id="site-header"></div>

  <main>

    <!-- ================= BREADCRUMB BAND ================= -->
    <section class="fk-page-header">
      <div class="container">
        <ul id="breadcrumb" class="fk-breadcrumb"></ul>
      </div>
    </section>

    <!-- ================= PRODUCT (filled by js/product-detail.js) ================= -->
    <section class="py-5">
      <div id="productDetail" class="container"></div>
    </section>

    <!-- ================= RELATED PRODUCTS ================= -->
    <section id="relatedSection" class="py-5 bg-body-tertiary d-none">
      <div class="container">
        <h2 class="fk-section-title h3" data-i18n="detail.related"></h2>
        <div id="relatedGrid" class="row g-4"></div>
      </div>
    </section>

  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/components.js"></script>
  <script src="js/data.js"></script>
  <script src="js/product-detail.js"></script>
</body>
</html>
