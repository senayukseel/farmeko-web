<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>İletişim | FARMEKO</title>
  <meta name="description" content="Farmeko iletişim: adres, telefon, e-posta ve iletişim formu.">

  <!-- Favicon & app icons (FARMEKO standard block - same on every page) -->
  <link rel="icon" type="image/png" href="images/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
  <link rel="shortcut icon" href="images/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="FARMEKO" />
  <link rel="manifest" href="images/site.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />

    <!-- Fonts: preload so text does not jump when the font arrives -->
  <link rel="preload" href="fonts/PlusJakartaSans-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/PlayfairDisplay-Variable.woff2" as="font" type="font/woff2" crossorigin>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">

  <!-- Apply saved theme BEFORE render to avoid a white flash -->
  <script>
    try { document.documentElement.setAttribute("data-bs-theme", localStorage.getItem("farmeko_theme") || "light"); } catch (e) {}
  </script>

  <style>
    /* Section titles */
    /* Section titles: extra bottom space on this page */
    .fk-section-title { margin-bottom: 1.2rem; }

    /* Contact info cards */
    .fk-info-card {
      display: flex; gap: .9rem; align-items: flex-start;
      border: 1px solid var(--bs-border-color);
      border-radius: var(--fk-radius);
      background: var(--bs-body-bg);
      padding: 1rem 1.1rem;
      height: 100%;
      text-decoration: none; color: inherit;
      transition: all .2s ease;
    }
    a.fk-info-card:hover { border-color: var(--fk-green-light); box-shadow: 0 8px 22px rgba(74,133,10,.15); color: inherit; }
    .fk-info-icon {
      flex: 0 0 46px; width: 46px; height: 46px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(116,204,0,.15); color: var(--fk-accent); font-size: 1.3rem;
    }
    .fk-info-card small { color: var(--bs-secondary-color); text-transform: uppercase; letter-spacing: .5px; font-weight: 700; font-size: .7rem; }
    .fk-info-card .fk-info-value { font-weight: 600; word-break: break-word; }

    /* Social */
    .fk-social-row a {
      width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center;
      border-radius: 50%; border: 1px solid var(--bs-border-color);
      color: var(--bs-body-color); text-decoration: none; font-size: 1.15rem;
      transition: all .2s ease;
    }
    .fk-social-row a:hover { background: var(--fk-green-light); border-color: var(--fk-green-light); color: #000; }

    /* Map */
    .fk-map {
      border: 1px solid var(--bs-border-color);
      border-radius: var(--fk-radius);
      overflow: hidden;
      min-height: 380px;
      background: var(--bs-tertiary-bg);
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 1.5rem;
    }
    .fk-map iframe { width: 100%; height: 380px; border: 0; display: block; }
    .fk-map i { font-size: 3rem; color: var(--bs-secondary-color); }
  </style>
</head>
<body>

  <div id="site-header"></div>

  <main>

    <!-- ================= PAGE HEADER ================= -->
    <section class="fk-page-header">
      <div class="container">
        <h1 data-i18n="ct.title"></h1>
        <ul class="fk-breadcrumb">
          <li><a href="index.html" data-i18n="nav.home"></a></li>
          <li data-i18n="nav.contact"></li>
        </ul>
      </div>
    </section>

    <!-- ================= INFO + FORM ================= -->
    <section class="py-5">
      <div class="container">
        <div class="row g-5">

          <!-- Contact info (filled by js/contact.js from CONFIG) -->
          <div class="col-lg-5">
            <h2 class="fk-section-title h3" data-i18n="ct.info.title"></h2>
            <p class="text-body-secondary mb-4" data-i18n="ct.info.text"></p>

            <div id="contactCards" class="row g-3"></div>

            <h3 class="h6 fw-bold mt-4 mb-3" data-i18n="ct.follow"></h3>
            <div id="contactSocial" class="fk-social-row d-flex gap-2"></div>
          </div>

          <!-- Form -->
          <div class="col-lg-7">
            <div class="fk-form-card">
              <h2 class="h4 fw-bold mb-1" data-i18n="ct.form.title"></h2>
              <p class="text-body-secondary small mb-4" data-i18n="ct.form.note"></p>

              <form id="contactForm" novalidate>

                <!-- Honeypot (bots fill this, people never see it) -->
                <div class="fk-hp" aria-hidden="true">
                  <label for="website">Website</label>
                  <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
                </div>

                <div class="row g-3">
                  <div class="col-md-6">
                    <label for="ctName" class="form-label"><span data-i18n="ct.f.name"></span> *</label>
                    <input type="text" class="form-control" id="ctName" name="name" required minlength="2" autocomplete="name">
                    <div class="invalid-feedback" data-i18n="ct.err.required"></div>
                  </div>
                  <div class="col-md-6">
                    <label for="ctEmail" class="form-label"><span data-i18n="ct.f.email"></span> *</label>
                    <input type="email" class="form-control" id="ctEmail" name="email" required autocomplete="email">
                    <div class="invalid-feedback" data-i18n="ct.err.email"></div>
                  </div>
                  <div class="col-md-6">
                    <label for="ctPhone" class="form-label" data-i18n="ct.f.phone"></label>
                    <input type="tel" class="form-control" id="ctPhone" name="phone" placeholder="+90 532 123 45 67" autocomplete="tel">
                    <div class="invalid-feedback" data-i18n="ct.err.phone"></div>
                  </div>
                  <div class="col-md-6">
                    <label for="ctSubject" class="form-label"><span data-i18n="ct.f.subject"></span> *</label>
                    <select class="form-select" id="ctSubject" name="subject" required>
                      <option value="" data-i18n="ct.select"></option>
                      <option value="quote" data-i18n="ct.subject.quote"></option>
                      <option value="info" data-i18n="ct.subject.info"></option>
                      <option value="support" data-i18n="ct.subject.support"></option>
                      <option value="other" data-i18n="ct.subject.other"></option>
                    </select>
                    <div class="invalid-feedback" data-i18n="ct.err.select"></div>
                  </div>
                  <div class="col-12">
                    <label for="ctMessage" class="form-label"><span data-i18n="ct.f.message"></span> *</label>
                    <textarea class="form-control" id="ctMessage" name="message" rows="5" required minlength="10" maxlength="1500"></textarea>
                    <div class="invalid-feedback" data-i18n="ct.err.message"></div>
                  </div>
                  <div class="col-12">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="ctConsent" name="consent" required>
                      <label class="form-check-label small" for="ctConsent" data-i18n="ct.consent"></label>
                      <div class="invalid-feedback" data-i18n="ct.err.consent"></div>
                    </div>
                  </div>
                  <div class="col-12">
                    <button type="submit" class="btn btn-farmeko btn-lg w-100">
                      <i class="bi bi-send-fill me-2"></i><span data-i18n="ct.submit"></span>
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>

        </div>
      </div>
    </section>

    <!-- ================= MAP ================= -->
    <section class="pb-5">
      <div class="container">
        <!-- Filled by js/contact.js. To show a real map, set MAP_EMBED_URL in contact.js -->
        <div id="mapBox" class="fk-map"></div>
      </div>
    </section>

  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/components.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
